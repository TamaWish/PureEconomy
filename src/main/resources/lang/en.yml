# =============================================================================
# PureEconomy English Language File
# =============================================================================
# Copy this file to lang/<code>.yml, translate the messages, then set
# language: <code> in config.yml.
# Prefer MiniMessage tags (<red>, <green>, <gray>, …). Legacy & codes still work.
# Keep placeholders like {prefix}, {brand}, and {amount} unchanged.
# {brand} is a lime→emerald gradient on Paper / Purpur / Folia.
# The shipped prefix uses the same gradient; a custom prefix is left as written.
# =============================================================================

# =============================================================================
# Prefix
# =============================================================================

prefix: "<gradient:#C8FF7A:#3DDC84><bold>Eco</bold></gradient> <dark_gray>»</dark_gray> "

# =============================================================================
# Update Checker
# =============================================================================

update-available: "{prefix}<green>A new PureEconomy release is available: <white>{latest}</white> <gray>(running {current}).</gray>"
update-click: "{prefix}<aqua>Click here to open the GitHub release page.</aqua>"
update-hover: "<gray>Open <white>{url}</white></gray>"

# =============================================================================
# Errors and Validation
# =============================================================================

no-permission: "{prefix}<red>You cannot do that.</red>"
player-only: "{prefix}<red>Players only.</red>"
unknown-player: "{prefix}<red>Player not found: <white>{player}</white></red>"
unknown-currency: "{prefix}<red>Unknown currency: <white>{currency}</white></red>"
invalid-amount: "{prefix}<red>Invalid amount.</red>"
invalid-number: "{prefix}<red>That is not a number.</red>"
not-enough: "{prefix}<red>Not enough {currency}.</red>"
pay-self: "{prefix}<red>You cannot pay yourself.</red>"
pay-disabled: "{prefix}<red>That currency cannot be transferred.</red>"
pay-minimum: "{prefix}<red>Minimum transfer is {amount}.</red>"
max-balance: "{prefix}<red>That would exceed the max balance for {currency}.</red>"
bank-max-balance: "{prefix}<red>That would exceed the bank balance limit for {currency}.</red>"
bank-not-enough: "{prefix}<red>Not enough {currency} in your bank.</red>"
account-missing: "{prefix}<red>No account for {player}.</red>"

# =============================================================================
# Balance Messages
# =============================================================================

balance-self: "{prefix}<gray>Your {currency}: <white>{amount}</white> <dark_gray>(</dark_gray><gray>bank <white>{bank}</white></gray><dark_gray>)</dark_gray>"
balance-other: "{prefix}<white>{player}</white><gray>'s {currency}: <white>{amount}</white> <dark_gray>(</dark_gray><gray>bank <white>{bank}</white></gray><dark_gray>)</dark_gray>"
balance-all-header: "{prefix}<gray>Balances for <white>{player}</white><gray>:</gray>"
balance-all-line: "<dark_gray>- <white>{currency}</white><gray>: <white>{amount}</white> <dark_gray>(</dark_gray><gray>bank <white>{bank}</white></gray><dark_gray>)</dark_gray>"

# =============================================================================
# Player Payments
# =============================================================================

pay-sent: "{prefix}<gray>Sent <white>{amount}</white> to <white>{player}</white>.</gray>"
pay-received: "{prefix}<gray>Received <white>{amount}</white> from <white>{player}</white>.</gray>"

# =============================================================================
# Bank
# =============================================================================

bank-balance: "{prefix}<gray>Your banked {currency}: <white>{amount}</white></gray>"
bank-balance-header: "{prefix}<gray>Your bank balances:</gray>"
bank-balance-line: "<dark_gray>- <white>{currency}</white><gray>: <white>{amount}</white></gray>"
bank-transfer: "{prefix}<gray>Transferred <white>{amount}</white> to your bank.</gray>"
bank-withdraw: "{prefix}<gray>Withdrew <white>{amount}</white> from your bank.</gray>"
bank-failed: "{prefix}<red>Could not complete that bank transfer.</red>"

# =============================================================================
# Administrative Economy Messages
# =============================================================================

eco-give: "{prefix}<gray>Gave <white>{amount}</white> to <white>{player}</white>.</gray>"
eco-take: "{prefix}<gray>Took <white>{amount}</white> from <white>{player}</white>.</gray>"
eco-set: "{prefix}<gray>Set <white>{player}</white>'s {currency} to <white>{amount}</white>.</gray>"
eco-reset: "{prefix}<gray>Reset <white>{player}</white>'s wallet {currency} to starting balance.</gray>"
eco-bank-give: "{prefix}<gray>Gave <white>{amount}</white> to <white>{player}</white>'s bank.</gray>"
eco-bank-take: "{prefix}<gray>Took <white>{amount}</white> from <white>{player}</white>'s bank.</gray>"
eco-bank-set: "{prefix}<gray>Set <white>{player}</white>'s banked {currency} to <white>{amount}</white>.</gray>"
eco-bank-reset: "{prefix}<gray>Reset <white>{player}</white>'s banked {currency} to zero.</gray>"
eco-reload: "{prefix}<green>Reloaded config and language.</green>"

# =============================================================================
# Balance Leaderboard
# =============================================================================

baltop-header: "{prefix}<gray>Top {currency} <dark_gray>(</dark_gray><gray>page {page}</gray><dark_gray>)</dark_gray>"
baltop-line: "<yellow>{rank}. <white>{player}</white> <gray>- <white>{amount}</white></yellow>"
baltop-empty: "{prefix}<gray>Nobody has this currency yet.</gray>"
baltop-page: "{prefix}<red>No such page.</red>"

# =============================================================================
# Currency List
# =============================================================================

currency-list-header: "{prefix}<gray>Currencies <dark_gray>(default: <white>{default}</white>)</dark_gray>"
currency-list-line: "<dark_gray>- <white>{id}</white> <gray>{singular}/{plural}</gray> <dark_gray>({symbol})</dark_gray>"

# =============================================================================
# Command Usage
# =============================================================================

usage-balance: "{prefix}<gray>Usage: <white>/balance [player] [currency]</white></gray>"
usage-bank: "{prefix}<gray>Usage: <white>/bank \\<balance|transfer|withdraw\\> [amount] [currency]</white></gray>"
usage-pay: "{prefix}<gray>Usage: <white>/pay \\<player\\> \\<amount\\> [currency]</white></gray>"
usage-baltop: "{prefix}<gray>Usage: <white>/baltop [currency] [page]</white></gray>"
usage-eco: "{prefix}<gray>Usage: <white>/eco \\<give|take|set|reset|bank|reload\\> [player] [amount] [currency]</white></gray>"
usage-eco-bank: "{prefix}<gray>Usage: <white>/eco bank \\<give|take|set|reset\\> \\<player\\> [amount] [currency]</white></gray>"
