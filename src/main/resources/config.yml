# =============================================================================
# PureEconomy Configuration
# =============================================================================
# PureEconomy v1.2.0
# Author: Lozaine@TamaWish
# =============================================================================

# =============================================================================
# General Settings
# =============================================================================

# Language file to load from plugins/PureEconomy/lang/<code>.yml.
language: en

# Flush changed balances to storage at this interval in seconds.
# Set to 0 to save only when a player quits or the plugin disables.
# On MySQL networks keep this low (15–30) so other servers see updates sooner.
autosave-seconds: 60

# Create new player accounts using each currency's starting balance on join.
create-on-join: true

# Enable only on backend servers in a Velocity/Bungee network. Network mode requires MySQL and
# authoritative currency settings matching the proxy's config.yml.
network:
  enabled: false

# =============================================================================
# Update Checker
# =============================================================================

# Ask GitHub for the latest TamaWish/PureEconomy release when the plugin starts
# or its config is reloaded. If a newer release exists, console is notified and
# players with the configured pureeconomy.admin permission receive a clickable
# link to that release when they join.
update-checker:
  enabled: true

# =============================================================================
# Economy Settings
# =============================================================================

# Currency used by Vault and by commands when no currency is specified.
default-currency: coins

# Smallest amount players may transfer with /pay.
pay-minimum: 0.01

# =============================================================================
# Permissions
# =============================================================================

# Change these here, then run /eco reload (or restart).
#
#   node     Permission string checked by commands and granted in LuckPerms
#            (or any permission plugin). Rename only if you also grant the
#            new name. Leave the defaults if you are unsure.
#   default  Who has it when no permission plugin assigns it:
#              true   all players (Bukkit permission default)
#              op     operators only
#              false  nobody until a permission plugin grants it
#
# Console always bypasses these checks.
# LuckPerms (and similar) override default when they set the node explicitly.
# Grant pureeconomy.admin to give every admin economy permission at once.
#
# Missing keys are merged from the jar on load/reload; custom extra keys are kept.
permissions:
  # /balance — own wallet and bank
  balance:
    node: pureeconomy.balance
    default: true

  # /balance <player> — view another player's balances
  balance-others:
    node: pureeconomy.balance.others
    default: op

  # /bank — view own bank
  bank:
    node: pureeconomy.bank
    default: true

  # /bank transfer — wallet to bank
  bank-transfer:
    node: pureeconomy.bank.transfer
    default: true

  # /bank withdraw — bank to wallet
  bank-withdraw:
    node: pureeconomy.bank.withdraw
    default: true

  # /pay
  pay:
    node: pureeconomy.pay
    default: true

  # /baltop
  baltop:
    node: pureeconomy.baltop
    default: true

  # /currency
  currency:
    node: pureeconomy.currency
    default: true

  # Parent for /eco (LuckPerms grouping; commands check the specific nodes)
  eco:
    node: pureeconomy.eco
    default: op

  # /eco give|take|set|reset|reload
  eco-give:
    node: pureeconomy.eco.give
    default: op
  eco-take:
    node: pureeconomy.eco.take
    default: op
  eco-set:
    node: pureeconomy.eco.set
    default: op
  eco-reset:
    node: pureeconomy.eco.reset
    default: op
  eco-reload:
    node: pureeconomy.eco.reload
    default: op

  # /eco bank give|take|set|reset
  eco-bank:
    node: pureeconomy.eco.bank
    default: op
  eco-bank-give:
    node: pureeconomy.eco.bank.give
    default: op
  eco-bank-take:
    node: pureeconomy.eco.bank.take
    default: op
  eco-bank-set:
    node: pureeconomy.eco.bank.set
    default: op
  eco-bank-reset:
    node: pureeconomy.eco.bank.reset
    default: op

  # All admin economy permissions in one node
  admin:
    node: pureeconomy.admin
    default: op

# =============================================================================
# Storage
# =============================================================================
# yaml (default) — single data.yml, fine for small servers. Not lag-free at tens of thousands of accounts.
# sqlite — recommended local store (economy.db via Hikari); imports data.yml once if the DB is empty.
# mysql — shared database for large / network servers. YAML is left on disk as backup.
#
# SQL commands and network I/O run off-thread. Hot accounts live in Caffeine.
# PlaceholderAPI uses peekBalance (cache only — never JDBC).
storage:
  type: yaml
  sqlite:
    file: economy.db
  mysql:
    host: localhost
    port: 3306
    database: pureeconomy
    username: root
    password: ""
    pool-size: 8
    connection-timeout-ms: 5000
    query-timeout-seconds: 5
    deadlock-retries: 3
  cache:
    max-accounts: 2000
    expire-minutes: 30
    baltop-ttl-seconds: 15
    # Network-mode balance cache for PAPI / Vault reads (100–500).
    network-ttl-millis: 250

# =============================================================================
# Currencies
# =============================================================================

# Add optional currencies below. Fresh installations only use coins.
# See https://github.com/TamaWish/PureEconomy for a complete multi-currency
# example and payout guide.
# IDs must contain only lowercase letters, numbers, and underscores.
currencies:
  coins:
    singular: Coin
    plural: Coins
    symbol: "$"
    decimals: 2
    starting-balance: 100.00
    # Set to -1 for no balance cap.
    max-balance: -1
    payable: true
